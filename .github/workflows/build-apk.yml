name: Compila APK di Nexa

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      - name: Compila APK
        run: ./gradlew :app:assembleRelease

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk Nexa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nexa-apk
          path: Nexa.apk

      # Pubblica (o aggiorna) la release "ultima-versione": la pagina si apre dal telefono e l'APK si scarica con un tocco.
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versione
          name: Nexa — ultima versione
          body: |
            APK compilato automaticamente dal commit ${{ github.sha }} (build ${{ github.run_number }}).
            Scarica **Nexa.apk** qui sotto e aprilo sul telefono per installarlo o aggiornarlo.
          files: Nexa.apk
          prerelease: false
          make_latest: true
