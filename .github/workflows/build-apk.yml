name: Compila APK di Nexa

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --tests 'com.nexa.assistant.agent.*'

      - name: Compila APK
        run: ./gradlew :app:assembleRelease

      - name: Prepara APK e version.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Nexa.apk
          NOTES=$(printf '%s' "${COMMIT_MSG:-Nuova versione}" | head -n 1)
          jq -n \
            --argjson code "${{ github.run_number }}" \
            --arg name "0.1.${{ github.run_number }}" \
            --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Nexa-apk
          path: Nexa.apk

      # Pubblica (o aggiorna) la release "ultima-versione": la pagina si apre dal telefono e l'APK si scarica con un tocco.
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versione
          name: Nexa — ultima versione
          body: |
            Versione 0.1.${{ github.run_number }} — compilata automaticamente dal commit ${{ github.sha }}.
            Scarica **Nexa.apk** qui sotto e aprilo sul telefono per installarlo o aggiornarlo.
          files: |
            Nexa.apk
            version.json
          overwrite_files: true
          prerelease: false
          make_latest: true
